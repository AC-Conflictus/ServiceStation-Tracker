<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Semester report — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">
          Semester — <span th:text="${report.semester}">Fall</span>
          <span th:text="${report.year}">2026</span>
        </h1>
        <a class="btn btn-outline-secondary btn-sm"
           th:href="@{/reports/semester.csv(year=${report.year},semester=${report.semester})}">Download CSV</a>
      </div>

      <form th:action="@{/reports/semester}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label class="form-label">Year</label>
          <select name="year" class="form-select">
            <option
              th:each="y : ${report.yearOptions}"
              th:value="${y}"
              th:text="${y}"
              th:selected="${y == report.year}">2026</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label">Semester</label>
          <select name="semester" class="form-select">
            <option
              th:each="s : ${report.semesterOptions}"
              th:value="${s}"
              th:text="${s}"
              th:selected="${s == report.semester}">Fall</option>
          </select>
        </div>
        <div class="col-auto"><button type="submit" class="btn btn-primary">View</button></div>
      </form>

      <p class="lead">
        Total hours (<span th:text="${report.semester}">Fall</span>
        <span th:text="${report.year}">2026</span>):
        <span class="badge text-bg-primary" th:text="${report.totalHours}">0</span>
      </p>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-header">Top community agencies</div>
            <table class="table table-sm mb-0">
              <tr th:each="t : ${report.topAgencies}">
                <td th:text="${t.name}">Name</td>
                <td class="text-end" th:text="${t.total}">0</td>
              </tr>
            </table>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-header">Top campus organizations</div>
            <table class="table table-sm mb-0">
              <tr th:each="t : ${report.topCampusOrgs}">
                <td th:text="${t.name}">Name</td>
                <td class="text-end" th:text="${t.total}">0</td>
              </tr>
            </table>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-header">Top events</div>
            <table class="table table-sm mb-0">
              <tr th:each="t : ${report.topEvents}">
                <td th:text="${t.name}">Name</td>
                <td class="text-end" th:text="${t.total}">0</td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <p class="mt-3"><a th:href="@{/reports}">&larr; All reports</a></p>
    </main>
  </body>
</html>
