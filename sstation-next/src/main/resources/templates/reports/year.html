<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Year report — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">By year — 5-year KPIs</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/reports/year.csv}">Download CSV</a>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <div style="height: 360px"><canvas id="chart"></canvas></div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Year</th>
              <th>Approved hours</th>
              <th>Avg / student</th>
              <th>Avg / campus org</th>
              <th>Avg / community agency</th>
              <th>Avg / event</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="k : ${kpis}">
              <td th:text="${k.year}">2026</td>
              <td th:text="${k.total}">0</td>
              <td th:text="${k.avgByStudent}">0</td>
              <td th:text="${k.avgByGroup}">0</td>
              <td th:text="${k.avgByCommOrg}">0</td>
              <td th:text="${k.avgByEvent}">0</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p><a th:href="@{/reports}">&larr; All reports</a></p>

      <script th:inline="javascript">
        /*<![CDATA[*/
        var kpis = /*[[${kpis}]]*/ [];
        new Chart(document.getElementById("chart"), {
          type: "bar",
          data: {
            labels: kpis.map(function (k) { return k.year; }),
            datasets: [{ label: "Hours", data: kpis.map(function (k) { return k.total; }), backgroundColor: "#0d6efd" }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { title: { display: true, text: "Approved hours by year" }, legend: { display: false } },
            scales: { y: { beginAtZero: true, title: { display: true, text: "Hours" } } },
          },
        });
        /*]]>*/
      </script>
    </main>
  </body>
</html>
