<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Year report — Service Station Hours</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-4">By year — 5-year KPIs</h1>

      <div class="card mb-4">
        <div class="card-body">
          <div id="chart" style="height: 360px"></div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Year</th>
              <th>Approved hours</th>
              <th>Avg / student</th>
              <th>Avg / campus org</th>
              <th>Avg / community agency</th>
              <th>Avg / event</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="k : ${kpis}">
              <td th:text="${k.year}">2026</td>
              <td th:text="${k.total}">0</td>
              <td th:text="${k.avgByStudent}">0</td>
              <td th:text="${k.avgByGroup}">0</td>
              <td th:text="${k.avgByCommOrg}">0</td>
              <td th:text="${k.avgByEvent}">0</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p><a th:href="@{/reports}">&larr; All reports</a></p>

      <script th:inline="javascript">
        /*<![CDATA[*/
        var kpis = /*[[${kpis}]]*/ [];
        Highcharts.chart("chart", {
          chart: { type: "column" },
          title: { text: "Approved hours by year" },
          xAxis: { categories: kpis.map(function (k) { return k.year; }) },
          yAxis: { title: { text: "Hours" } },
          series: [{ name: "Hours", data: kpis.map(function (k) { return k.total; }) }],
        });
        /*]]>*/
      </script>
    </main>
  </body>
</html>
