<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Reports — Service Station Hours</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-4">Reports</h1>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h5 card-title">Standard reports</h2>
              <div class="list-group">
                <a class="list-group-item list-group-item-action" th:href="@{/reports/year}"
                  >By year (5-year KPIs)</a
                >
                <a class="list-group-item list-group-item-action" th:href="@{/reports/event}"
                  >By event</a
                >
                <a class="list-group-item list-group-item-action" th:href="@{/reports/community-org}"
                  >By community agency</a
                >
                <a class="list-group-item list-group-item-action" th:href="@{/reports/campus-org}"
                  >By campus organization</a
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card mb-3">
            <div class="card-body">
              <h2 class="h5 card-title">Summary (by year)</h2>
              <form th:action="@{/reports/summary}" method="get" class="row g-2 align-items-end">
                <div class="col-auto">
                  <label class="form-label">Year</label>
                  <select name="year" class="form-select">
                    <option th:each="y : ${yearOptions}" th:value="${y}" th:text="${y}">2026</option>
                  </select>
                </div>
                <div class="col-auto">
                  <button type="submit" class="btn btn-primary">View summary</button>
                </div>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h2 class="h5 card-title">Semester</h2>
              <form th:action="@{/reports/semester}" method="get" class="row g-2 align-items-end">
                <div class="col-auto">
                  <label class="form-label">Year</label>
                  <select name="year" class="form-select">
                    <option th:each="y : ${yearOptions}" th:value="${y}" th:text="${y}">2026</option>
                  </select>
                </div>
                <div class="col-auto">
                  <label class="form-label">Semester</label>
                  <select name="semester" class="form-select">
                    <option th:each="s : ${semesterOptions}" th:value="${s}" th:text="${s}">Fall</option>
                  </select>
                </div>
                <div class="col-auto">
                  <button type="submit" class="btn btn-primary">View semester</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
