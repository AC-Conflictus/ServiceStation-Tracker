<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Summary report — Service Station Hours</title>
  </head>
  <body>
    <h1>Summary — <span th:text="${report.year}">2026</span></h1>

    <form th:action="@{/reports/summary}" method="get">
      <label
        >Year
        <select name="year">
          <option
            th:each="y : ${report.yearOptions}"
            th:value="${y}"
            th:text="${y}"
            th:selected="${y == report.year}">
            2026
          </option>
        </select>
      </label>
      <button type="submit">View</button>
    </form>

    <p>
      Total hours in <span th:text="${report.year}">2026</span>:
      <strong th:text="${report.totalHours}">0</strong>
    </p>

    <h2>Top community agencies</h2>
    <table border="1" cellpadding="4">
      <tr th:each="t : ${report.topAgencies}">
        <td th:text="${t.name}">Agency</td>
        <td th:text="${t.total}">0</td>
      </tr>
    </table>

    <h2>Top campus organizations</h2>
    <table border="1" cellpadding="4">
      <tr th:each="t : ${report.topCampusOrgs}">
        <td th:text="${t.name}">Org</td>
        <td th:text="${t.total}">0</td>
      </tr>
    </table>

    <h2>Top events</h2>
    <table border="1" cellpadding="4">
      <tr th:each="t : ${report.topEvents}">
        <td th:text="${t.name}">Event</td>
        <td th:text="${t.total}">0</td>
      </tr>
    </table>

    <p><a th:href="@{/reports}">All reports</a></p>
  </body>
</html>
