<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Event report — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">By event — approved hours</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/reports/event.csv}">Download CSV</a>
      </div>

      <div class="card mb-4">
        <div class="card-body"><div style="height: 380px"><canvas id="chart"></canvas></div></div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Event</th>
              <th>Approved hours</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="t : ${totals}">
              <td th:text="${t.name}">Event</td>
              <td th:text="${t.total}">0</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p><a th:href="@{/reports}">&larr; All reports</a></p>

      <script th:inline="javascript">
        /*<![CDATA[*/
        var totals = /*[[${totals}]]*/ [];
        new Chart(document.getElementById("chart"), {
          type: "bar",
          data: {
            labels: totals.map(function (t) { return t.name; }),
            datasets: [{ label: "Hours", data: totals.map(function (t) { return t.total; }), backgroundColor: "#0d6efd" }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: "y",
            plugins: { title: { display: true, text: "Approved hours by event" }, legend: { display: false } },
            scales: { x: { beginAtZero: true, title: { display: true, text: "Hours" } } },
          },
        });
        /*]]>*/
      </script>
    </main>
  </body>
</html>
