<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Event report — Service Station Hours</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
  </head>
  <body>
    <h1>By event — approved hours</h1>

    <table border="1" cellpadding="4">
      <thead>
        <tr>
          <th>Event</th>
          <th>Approved hours</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="t : ${totals}">
          <td th:text="${t.name}">Event</td>
          <td th:text="${t.total}">0</td>
        </tr>
      </tbody>
    </table>

    <div id="chart" style="width: 720px; height: 380px"></div>

    <p><a th:href="@{/reports}">All reports</a></p>

    <script th:inline="javascript">
      /*<![CDATA[*/
      var totals = /*[[${totals}]]*/ [];
      Highcharts.chart("chart", {
        chart: { type: "bar" },
        title: { text: "Approved hours by event" },
        xAxis: { categories: totals.map(function (t) { return t.name; }) },
        yAxis: { title: { text: "Hours" } },
        series: [{ name: "Hours", data: totals.map(function (t) { return t.total; }) }],
      });
      /*]]>*/
    </script>
  </body>
</html>
