<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Service hours</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>
  <body>
    <h1 th:text="${title}">Service hours</h1>
    <p th:if="${message}" th:text="${message}" style="color: #060"></p>

    <p>
      <a th:href="@{/admin/hours/new}">+ New service hour</a> ·
      <a th:href="@{/admin/hours}">All</a> · <a th:href="@{/admin/hours/pending}">Pending only</a>
    </p>

    <table border="1" cellpadding="4">
      <thead>
        <tr>
          <th>Student</th>
          <th>Date</th>
          <th>Hours</th>
          <th>Status</th>
          <th>Event</th>
          <th>Campus org</th>
          <th>Community agency</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="h : ${hours}" th:id="'hour-' + ${h.id}">
          <td th:text="${h.student.fullName}">Sam Student</td>
          <td th:text="${#temporals.format(h.startTime, 'yyyy-MM-dd')}">2026-01-01</td>
          <td th:text="${h.duration}">0</td>
          <td th:id="'status-' + ${h.id}" th:text="${h.status}">PENDING</td>
          <td th:text="${h.event != null ? h.event.name : (h.otherCamOrg != null ? '' : '—')}">—</td>
          <td th:text="${h.campusOrg != null ? h.campusOrg.name : (h.otherCamOrg != null ? h.otherCamOrg : '—')}">—</td>
          <td th:text="${h.commAg != null ? h.commAg.name : (h.otherCommAg != null ? h.otherCommAg : '—')}">—</td>
          <td>
            <a th:href="@{/admin/hours/{id}/edit(id=${h.id})}">Edit</a>
            <span sec:authorize="hasRole('ADMIN')">
              | <button type="button" th:onclick="|setStatus(${h.id}, 'APPROVED')|">Approve</button>
              <button type="button" th:onclick="|setStatus(${h.id}, 'REJECTED')|">Reject</button>
              | <a th:href="@{/admin/hours/{id}/audit(id=${h.id})}">Audit</a>
            </span>
            <form
              th:action="@{/admin/hours/{id}/delete(id=${h.id})}"
              method="post"
              style="display: inline"
              onsubmit="return confirm('Delete this service hour?');">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${hours.isEmpty()}">
          <td colspan="8">No service hours.</td>
        </tr>
      </tbody>
    </table>

    <p><a th:href="@{/admin}">Admin dashboard</a></p>

    <script th:inline="javascript">
      /*<![CDATA[*/
      var csrfToken = document.querySelector('meta[name="_csrf"]').content;
      var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

      function setStatus(id, status) {
        var headers = { "Content-Type": "application/x-www-form-urlencoded" };
        headers[csrfHeader] = csrfToken;
        fetch("/admin/hours/" + id + "/status", {
          method: "POST",
          headers: headers,
          body: "status=" + status,
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            document.getElementById("status-" + data.id).textContent = data.status;
          })
          .catch(function (e) {
            alert("Could not update status: " + e.message);
          });
      }
      /*]]>*/
    </script>
  </body>
</html>
