<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Audit trail — Service Station Hours</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-2">Audit trail</h1>
      <p class="text-muted">
        Service hour #<span th:text="${hour.id}">1</span> —
        <strong th:text="${hour.student.fullName}">Sam Student</strong>,
        <span th:text="${hour.duration}">0</span> hours, current status
        <span class="badge"
              th:classappend="${hour.status.name() == 'APPROVED'} ? 'text-bg-success' : (${hour.status.name() == 'REJECTED'} ? 'text-bg-danger' : 'text-bg-warning')"
              th:text="${hour.status}">PENDING</span>.
      </p>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr><th>When</th><th>Actor</th><th>From</th><th>To</th><th>Note</th></tr>
          </thead>
          <tbody>
            <tr th:each="e : ${entries}">
              <td th:text="${#temporals.format(e.timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 10:00:00</td>
              <td th:text="${e.actor != null ? e.actor.username : 'system'}">admin</td>
              <td th:text="${e.fromStatus != null ? e.fromStatus : '—'}">—</td>
              <td th:text="${e.toStatus}">APPROVED</td>
              <td th:text="${e.note}">note</td>
            </tr>
            <tr th:if="${entries.isEmpty()}"><td colspan="5" class="text-muted">No audit entries.</td></tr>
          </tbody>
        </table>
      </div>

      <p><a th:href="@{/admin/hours}">&larr; Back to service hours</a></p>
    </main>
  </body>
</html>
