<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${heading}">Service hour</title>
  </head>
  <body>
    <h1 th:text="${heading}">Service hour</h1>

    <form
      th:object="${form}"
      th:action="${hourId == null} ? @{/admin/hours} : @{/admin/hours/{id}(id=${hourId})}"
      method="post">
      <p>
        <label
          >Student<br />
          <select th:field="*{studentId}">
            <option value="">— select —</option>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}">Sam</option>
          </select>
        </label>
        <span th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}" style="color: #b00"></span>
      </p>
      <p>
        <label>Description<br /><textarea th:field="*{description}" rows="2" cols="50"></textarea></label>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: #b00"></span>
      </p>
      <p>
        <label>Duration (hours)<br /><input type="number" step="0.25" th:field="*{duration}" /></label>
        <span th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" style="color: #b00"></span>
      </p>
      <p>
        <label>Start time<br /><input type="datetime-local" th:field="*{startTime}" /></label>
        <span th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" style="color: #b00"></span>
      </p>
      <p>
        <label
          >Status<br />
          <select th:field="*{status}">
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}">PENDING</option>
          </select>
        </label>
        <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color: #b00"></span>
      </p>
      <p>
        <label
          >Event<br />
          <select th:field="*{eventId}">
            <option value="">— none —</option>
            <option th:each="e : ${events}" th:value="${e.id}" th:text="${e.name}">Event</option>
          </select>
        </label>
      </p>
      <p>
        <label
          >Campus organization<br />
          <select th:field="*{campusOrgId}">
            <option value="">— none —</option>
            <option th:each="o : ${campusOrgs}" th:value="${o.id}" th:text="${o.name}">Org</option>
          </select>
        </label>
        <label> or other: <input type="text" th:field="*{otherCamOrg}" /></label>
      </p>
      <p>
        <label
          >Community agency<br />
          <select th:field="*{commAgId}">
            <option value="">— none —</option>
            <option th:each="a : ${agencies}" th:value="${a.id}" th:text="${a.name}">Agency</option>
          </select>
        </label>
        <label> or other: <input type="text" th:field="*{otherCommAg}" /></label>
      </p>
      <fieldset>
        <legend>Event contact (optional)</legend>
        <p><label>Name <input type="text" th:field="*{eventContactName}" /></label></p>
        <p><label>Phone <input type="text" th:field="*{eventContactPhone}" /></label></p>
        <p>
          <label>Email <input type="text" th:field="*{eventContactEmail}" /></label>
          <span th:if="${#fields.hasErrors('eventContactEmail')}" th:errors="*{eventContactEmail}" style="color: #b00"></span>
        </p>
      </fieldset>
      <p><button type="submit">Save</button> <a th:href="@{/admin/hours}">Cancel</a></p>
    </form>
  </body>
</html>
