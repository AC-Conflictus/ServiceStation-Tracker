<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title th:text="${heading}">Service hour</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-3" th:text="${heading}">Service hour</h1>
      <form
        th:object="${form}"
        th:action="${hourId == null} ? @{/admin/hours} : @{/admin/hours/{id}(id=${hourId})}"
        method="post"
        class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Student</label>
          <select class="form-select" th:field="*{studentId}"
                  th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid'">
            <option value="">— select —</option>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}">Sam</option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Duration (hours)</label>
          <input type="number" step="0.25" class="form-control" th:field="*{duration}"
                 th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select class="form-select" th:field="*{status}"
                  th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}">PENDING</option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="2" th:field="*{description}"
                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Start time</label>
          <input type="datetime-local" class="form-control" th:field="*{startTime}"
                 th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Event</label>
          <select class="form-select" th:field="*{eventId}">
            <option value="">— none —</option>
            <option th:each="e : ${events}" th:value="${e.id}" th:text="${e.name}">Event</option>
          </select>
        </div>
        <div class="col-md-4"></div>
        <div class="col-md-4">
          <label class="form-label">Campus organization</label>
          <select class="form-select" th:field="*{campusOrgId}">
            <option value="">— none —</option>
            <option th:each="o : ${campusOrgs}" th:value="${o.id}" th:text="${o.name}">Org</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">…or other campus org</label>
          <input type="text" class="form-control" th:field="*{otherCamOrg}" />
        </div>
        <div class="col-md-4"></div>
        <div class="col-md-4">
          <label class="form-label">Community agency</label>
          <select class="form-select" th:field="*{commAgId}">
            <option value="">— none —</option>
            <option th:each="a : ${agencies}" th:value="${a.id}" th:text="${a.name}">Agency</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">…or other agency</label>
          <input type="text" class="form-control" th:field="*{otherCommAg}" />
        </div>
        <div class="col-12"><hr /><h2 class="h6 text-muted">Event contact (optional)</h2></div>
        <div class="col-md-4">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" th:field="*{eventContactName}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" th:field="*{eventContactPhone}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Email</label>
          <input type="text" class="form-control" th:field="*{eventContactEmail}"
                 th:classappend="${#fields.hasErrors('eventContactEmail')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('eventContactEmail')}" th:errors="*{eventContactEmail}"></div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/hours}">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
