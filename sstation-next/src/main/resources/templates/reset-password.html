<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Choose a new password — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 card-title mb-3">Choose a new password</h1>
              <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

              <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />
                <div class="mb-3">
                  <label class="form-label">New password</label>
                  <input type="password" name="password" class="form-control" required minlength="6" />
                </div>
                <button type="submit" class="btn btn-primary w-100">Set new password</button>
              </form>
              <p class="mt-3 mb-0"><a th:href="@{/login}">&larr; Back to sign in</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
