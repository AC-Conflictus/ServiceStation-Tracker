<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #212529; line-height: 1.5;">
    <p>Hi <span th:text="${studentName}">Student</span>,</p>
    <p>
      Your service-hour submission has been
      <strong th:text="${#strings.toLowerCase(status)}">approved</strong>.
    </p>
    <table cellpadding="6" style="border-collapse: collapse; margin: 12px 0;">
      <tr>
        <td style="font-weight: bold;">Date</td>
        <td th:text="${#temporals.format(hour.startTime, 'yyyy-MM-dd')}">2026-01-01</td>
      </tr>
      <tr>
        <td style="font-weight: bold;">Hours</td>
        <td th:text="${hour.duration}">0</td>
      </tr>
      <tr>
        <td style="font-weight: bold;">Description</td>
        <td th:text="${hour.description} ?: '—'">—</td>
      </tr>
    </table>
    <p style="color: #6c757d; font-size: 0.9em;">
      This is an automated message from the Austin College Service Station. Please do not reply.
    </p>
  </body>
</html>
