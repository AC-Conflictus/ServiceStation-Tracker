<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Campus organizations — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Campus organizations</h1>
        <a class="btn btn-primary" th:href="@{/admin/campus-orgs/new}">+ New campus organization</a>
      </div>
      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="o : ${orgs}">
              <td th:text="${o.name}">Org</td>
              <td th:text="${o.contact}">Contact</td>
              <td th:text="${o.contactPhone}">Phone</td>
              <td th:text="${o.contactEmail}">Email</td>
              <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/campus-orgs/{id}/edit(id=${o.id})}">Edit</a>
                <form
                  th:action="@{/admin/campus-orgs/{id}/delete(id=${o.id})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Delete this organization? Service hours are kept.');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${orgs.isEmpty()}"><td colspan="5" class="text-muted">No campus organizations yet.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
