<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Community agencies — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Community agencies</h1>
        <a class="btn btn-primary" th:href="@{/admin/agencies/new}">+ New community agency</a>
      </div>
      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr><th>Name</th><th>Address</th><th>Contact</th><th>Phone</th><th>Email</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="a : ${agencies}">
              <td th:text="${a.name}">Agency</td>
              <td th:text="${a.address}">Address</td>
              <td th:text="${a.contact}">Contact</td>
              <td th:text="${a.contactPhone}">Phone</td>
              <td th:text="${a.contactEmail}">Email</td>
              <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/agencies/{id}/edit(id=${a.id})}">Edit</a>
                <form
                  th:action="@{/admin/agencies/{id}/delete(id=${a.id})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Delete this agency? Service hours are kept.');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${agencies.isEmpty()}"><td colspan="6" class="text-muted">No community agencies yet.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
