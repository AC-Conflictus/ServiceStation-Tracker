<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Forgot password — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 card-title mb-3">Reset your password</h1>
              <div th:if="${message}" class="alert alert-info py-2" th:text="${message}"></div>
              <p class="text-muted small">
                Enter your Austin College email and we'll send you a reset link.
              </p>
              <form th:action="@{/forgot-password}" method="post">
                <div class="mb-3">
                  <label class="form-label">AC email</label>
                  <input type="email" name="email" class="form-control" autofocus required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Send reset link</button>
              </form>
              <p class="mt-3 mb-0"><a th:href="@{/login}">&larr; Back to sign in</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
