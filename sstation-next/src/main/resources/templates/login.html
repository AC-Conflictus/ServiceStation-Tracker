<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Sign in — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 card-title mb-3">Sign in</h1>

              <div th:if="${param.error}" class="alert alert-danger py-2">
                Invalid username or password.
              </div>
              <div th:if="${param.logout}" class="alert alert-success py-2">
                You have been signed out.
              </div>
              <div th:if="${param.reset}" class="alert alert-success py-2">
                Your password has been reset. Please sign in.
              </div>
              <div th:if="${param.changed}" class="alert alert-success py-2">
                Your password has been changed. Sign in again with your new password.
              </div>

              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input type="text" name="username" class="form-control" autofocus required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" name="password" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
              </form>
              <p class="mt-3 mb-0 text-center">
                <a th:href="@{/forgot-password}">Forgot password?</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
