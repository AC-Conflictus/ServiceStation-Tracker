<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>My report — Service Station Hours</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-3">My report</h1>

      <div th:unless="${hasProfile}" class="alert alert-warning">
        Your login isn't linked to a student profile yet.
      </div>

      <div th:if="${hasProfile}">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="h5 text-muted mb-0" th:text="${report.studentName}">Sam Student</h2>
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/student/report.csv}">Download CSV</a>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header">Approved hours by semester</div>
              <table class="table table-striped mb-0">
                <thead class="table-light">
                  <tr><th>Semester</th><th class="text-end">Hours</th><th class="text-end"># records</th></tr>
                </thead>
                <tbody>
                  <tr th:each="b : ${report.bySemester}">
                    <td th:text="${b.label}">2026 FA</td>
                    <td class="text-end" th:text="${b.hours}">0</td>
                    <td class="text-end" th:text="${b.count}">0</td>
                  </tr>
                  <tr th:if="${report.bySemester.isEmpty()}">
                    <td colspan="3" class="text-muted">No approved hours yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header">Approved hours by campus organization</div>
              <table class="table table-striped mb-0">
                <thead class="table-light">
                  <tr><th>Campus organization</th><th class="text-end">Hours</th><th class="text-end"># records</th></tr>
                </thead>
                <tbody>
                  <tr th:each="b : ${report.byCampusOrg}">
                    <td th:text="${b.label}">THINK</td>
                    <td class="text-end" th:text="${b.hours}">0</td>
                    <td class="text-end" th:text="${b.count}">0</td>
                  </tr>
                  <tr th:if="${report.byCampusOrg.isEmpty()}">
                    <td colspan="3" class="text-muted">No approved hours yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <p class="mt-3"><a th:href="@{/student}">&larr; My dashboard</a></p>
      </div>
    </main>
  </body>
</html>
