<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>My report — Service Station Hours</title>
  </head>
  <body>
    <h1>My report</h1>

    <div th:unless="${hasProfile}">
      <p>Your login isn't linked to a student profile yet.</p>
    </div>

    <div th:if="${hasProfile}">
      <h2 th:text="${report.studentName}">Sam Student</h2>

      <h3>Approved hours by semester</h3>
      <table border="1" cellpadding="4">
        <thead>
          <tr>
            <th>Semester</th>
            <th>Hours</th>
            <th># records</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${report.bySemester}">
            <td th:text="${b.label}">2026 FA</td>
            <td th:text="${b.hours}">0</td>
            <td th:text="${b.count}">0</td>
          </tr>
          <tr th:if="${report.bySemester.isEmpty()}">
            <td colspan="3">No approved hours yet.</td>
          </tr>
        </tbody>
      </table>

      <h3>Approved hours by campus organization</h3>
      <table border="1" cellpadding="4">
        <thead>
          <tr>
            <th>Campus organization</th>
            <th>Hours</th>
            <th># records</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${report.byCampusOrg}">
            <td th:text="${b.label}">THINK</td>
            <td th:text="${b.hours}">0</td>
            <td th:text="${b.count}">0</td>
          </tr>
          <tr th:if="${report.byCampusOrg.isEmpty()}">
            <td colspan="3">No approved hours yet.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p><a th:href="@{/student}">My dashboard</a> · <a th:href="@{/}">Home</a></p>
  </body>
</html>
