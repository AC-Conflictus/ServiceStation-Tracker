<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Change your password — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 card-title mb-3">Change your password</h1>

              <!--
                TC-121: shown when the bootstrap admin is forced here on first login. The filter
                sets this flag, so the page explains why it appeared rather than looking like the
                app refusing to navigate.
              -->
              <div th:if="${mustChange}" class="alert alert-warning py-2">
                This account was created with a password from the server's configuration. Choose
                your own before continuing — the original stays readable to anyone who can see the
                deployment settings.
              </div>

              <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

              <form th:action="@{/change-password}" method="post">
                <div class="mb-3">
                  <label class="form-label">Current password</label>
                  <input type="password" name="currentPassword" class="form-control" required autocomplete="current-password" />
                </div>
                <div class="mb-3">
                  <label class="form-label">New password</label>
                  <input
                    type="password"
                    name="newPassword"
                    class="form-control"
                    required
                    autocomplete="new-password"
                    th:minlength="${minLength}" />
                  <div class="form-text">
                    At least <span th:text="${minLength}">8</span> characters, and not one you're
                    already using.
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Change password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
