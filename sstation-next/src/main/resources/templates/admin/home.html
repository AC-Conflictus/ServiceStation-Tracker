<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Admin dashboard — Service Station Hours</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-3">Admin dashboard</h1>

      <form th:action="@{/admin}" method="get" class="row g-2 align-items-end mb-4">
        <div class="col-auto">
          <label class="form-label small mb-0">From</label>
          <input type="date" name="from" class="form-control form-control-sm"
                 th:value="${from != null ? #temporals.format(from, 'yyyy-MM-dd') : ''}"/>
        </div>
        <div class="col-auto">
          <label class="form-label small mb-0">To</label>
          <input type="date" name="to" class="form-control form-control-sm"
                 th:value="${to != null ? #temporals.format(to, 'yyyy-MM-dd') : ''}"/>
        </div>
        <div class="col-auto"><button type="submit" class="btn btn-primary btn-sm">Apply</button></div>
        <div class="col-auto">
          <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">Clear</a>
        </div>
        <div class="col-auto" th:if="${ranged}">
          <span class="badge text-bg-info align-middle">
            <span th:text="${from != null ? #temporals.format(from, 'yyyy-MM-dd') : '…'}">from</span>
            &rarr;
            <span th:text="${to != null ? #temporals.format(to, 'yyyy-MM-dd') : '…'}">to</span>
          </span>
        </div>
      </form>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md">
          <div class="card text-center h-100">
            <div class="card-body">
              <div class="text-muted small">Students</div>
              <div class="fs-4 fw-bold" th:text="${dashboard.overall.totalStudents}">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md">
          <div class="card text-center h-100">
            <div class="card-body">
              <div class="text-muted small" th:text="${ranged} ? 'Approved hours (period)' : 'Approved hours (all time)'">Approved hours</div>
              <div class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(dashboard.overall.totalHours, 1, 1)}">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md">
          <div class="card text-center h-100">
            <div class="card-body">
              <div class="text-muted small" th:text="${ranged} ? 'Approved (period)' : 'Approved this year'">Approved this year</div>
              <div class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(dashboard.overall.totalThisYear, 1, 1)}">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md">
          <div class="card text-center h-100">
            <div class="card-body">
              <div class="text-muted small">Avg / student</div>
              <div class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(dashboard.overall.averagePerStudent, 1, 2)}">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md">
          <a th:href="@{/admin/hours/pending}" class="text-decoration-none">
            <div class="card text-center h-100 border-warning">
              <div class="card-body">
                <div class="text-muted small">Pending requests</div>
                <div class="fs-4 fw-bold text-warning-emphasis" th:text="${dashboard.overall.pendingTotal}">0</div>
              </div>
            </div>
          </a>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card"><div class="card-body"><div style="height: 320px"><canvas id="chart-5year"></canvas></div></div></div>
        </div>
        <div class="col-lg-6">
          <div class="card"><div class="card-body"><div style="height: 320px"><canvas id="chart-monthly"></canvas></div></div></div>
        </div>
        <div class="col-lg-6">
          <div class="card"><div class="card-body"><div style="height: 320px"><canvas id="chart-classification"></canvas></div></div></div>
        </div>
        <div class="col-lg-6">
          <div class="card"><div class="card-body"><div style="height: 320px"><canvas id="chart-status"></canvas></div></div></div>
        </div>
      </div>

      <script th:inline="javascript">
        /*<![CDATA[*/
        var dashboard = /*[[${dashboard}]]*/ {};
        var ranged = /*[[${ranged}]]*/ false;
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        // Chart.js (TC-119). The wrapper div carries the height, so the canvas must be free to
        // fill it — hence maintainAspectRatio: false on every chart.
        var palette = ["#0d6efd", "#198754", "#dc3545", "#fd7e14", "#6f42c1", "#20c997"];
        function bars(canvasId, type, title, labels, data) {
          return new Chart(document.getElementById(canvasId), {
            type: type,
            data: { labels: labels, datasets: [{ label: "Hours", data: data, backgroundColor: palette[0], borderColor: palette[0] }] },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { title: { display: true, text: title }, legend: { display: false } },
              scales: { y: { beginAtZero: true, title: { display: true, text: "Hours" } } },
            },
          });
        }
        function share(canvasId, title, slices) {
          return new Chart(document.getElementById(canvasId), {
            type: "pie",
            data: {
              labels: slices.map(function (s) { return s.label; }),
              datasets: [{ data: slices.map(function (s) { return s.fraction; }), backgroundColor: palette }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { title: { display: true, text: title }, legend: { position: "bottom" } },
            },
          });
        }

        bars(
          "chart-5year", "bar",
          ranged ? "Approved hours by year (in range)" : "Approved hours — last 5 years",
          dashboard.fiveYear.years, dashboard.fiveYear.totals
        );

        bars(
          "chart-monthly", "line",
          ranged ? "Approved hours by month (in range)" : "Approved hours by month (this year)",
          months, dashboard.monthly.monthly
        );

        share("chart-classification", "Hours by classification", dashboard.byClassification);
        share("chart-status", "Hours by status", dashboard.byStatus);
        /*]]>*/
      </script>
    </main>
  </body>
</html>
