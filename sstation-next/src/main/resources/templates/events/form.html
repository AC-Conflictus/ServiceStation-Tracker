<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title th:text="${heading}">Event</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-3" th:text="${heading}">Event</h1>
      <div class="row">
        <div class="col-lg-7">
          <form
            th:object="${event}"
            th:action="${event.id == null} ? @{/admin/events} : @{/admin/events/{id}(id=${event.id})}"
            method="post">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" th:field="*{name}"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" th:field="*{description}"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contact</label>
              <input type="text" class="form-control" th:field="*{contact}"
                     th:classappend="${#fields.hasErrors('contact')} ? 'is-invalid'" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contact phone</label>
              <input type="text" class="form-control" th:field="*{contactPhone}"
                     th:classappend="${#fields.hasErrors('contactPhone')} ? 'is-invalid'" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contact email</label>
              <input type="text" class="form-control" th:field="*{contactEmail}"
                     th:classappend="${#fields.hasErrors('contactEmail')} ? 'is-invalid'" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/events}">Cancel</a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
