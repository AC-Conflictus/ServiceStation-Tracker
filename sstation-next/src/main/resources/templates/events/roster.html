<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Roster — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Roster — <span th:text="${event.name}">Event</span></h1>
        <form th:action="@{/admin/events/{id}/convert(id=${event.id})}" method="post"
              onsubmit="return confirm('Create pending service-hour records for all attended sign-ups?');">
          <button type="submit" class="btn btn-success">Convert attended → hours</button>
        </form>
      </div>
      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <p><a th:href="@{/admin/events}">&larr; All events</a></p>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr><th>Student</th><th>Signed up</th><th>Status</th><th>Converted</th><th class="text-end">Mark</th></tr>
          </thead>
          <tbody>
            <tr th:each="s : ${roster}">
              <td th:text="${s.student.fullName}">Sam Student</td>
              <td th:text="${#temporals.format(s.signupTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
              <td><span class="badge text-bg-secondary" th:text="${s.status.displayName}">Signed up</span></td>
              <td>
                <span th:if="${s.converted}" class="badge text-bg-success">Yes</span>
                <span th:unless="${s.converted}" class="text-muted">—</span>
              </td>
              <td class="text-end">
                <form th:action="@{/admin/signups/{id}/status(id=${s.id})}" method="post"
                      class="d-inline-flex gap-1 justify-content-end">
                  <input type="hidden" name="eventId" th:value="${event.id}"/>
                  <select name="status" class="form-select form-select-sm" style="width:auto">
                    <option th:each="st : ${signupStatuses}" th:value="${st}" th:text="${st.displayName}"
                            th:selected="${st == s.status}">Signed up</option>
                  </select>
                  <button type="submit" class="btn btn-sm btn-outline-secondary">Save</button>
                </form>
              </td>
            </tr>
            <tr th:if="${roster.isEmpty()}"><td colspan="5" class="text-muted">No sign-ups yet.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
