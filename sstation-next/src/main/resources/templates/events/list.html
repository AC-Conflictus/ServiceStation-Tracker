<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Events — Service Station Hours</title>
  </head>
  <body>
    <h1>Events</h1>
    <p th:if="${message}" th:text="${message}" style="color: #060"></p>

    <p><a th:href="@{/admin/events/new}">+ New event</a></p>

    <table border="1" cellpadding="4">
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td th:text="${e.name}">Event</td>
          <td th:text="${e.contact}">Contact</td>
          <td th:text="${e.contactPhone}">Phone</td>
          <td th:text="${e.contactEmail}">Email</td>
          <td>
            <a th:href="@{/admin/events/{id}/edit(id=${e.id})}">Edit</a>
            <form
              th:action="@{/admin/events/{id}/delete(id=${e.id})}"
              method="post"
              style="display: inline"
              onsubmit="return confirm('Delete this event? Service hours are kept.');">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${events.isEmpty()}">
          <td colspan="5">No events yet.</td>
        </tr>
      </tbody>
    </table>

    <p><a th:href="@{/admin}">Admin dashboard</a></p>
  </body>
</html>
