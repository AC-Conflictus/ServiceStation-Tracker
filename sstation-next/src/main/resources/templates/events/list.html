<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title>Events — Service Station Hours</title>
  </head>
  <body>
    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Events</h1>
        <a class="btn btn-primary" th:href="@{/admin/events/new}">+ New event</a>
      </div>
      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-light">
            <tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="e : ${events}">
              <td th:text="${e.name}">Event</td>
              <td th:text="${e.contact}">Contact</td>
              <td th:text="${e.contactPhone}">Phone</td>
              <td th:text="${e.contactEmail}">Email</td>
              <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/events/{id}/edit(id=${e.id})}">Edit</a>
                <form
                  th:action="@{/admin/events/{id}/delete(id=${e.id})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Delete this event? Service hours are kept.');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${events.isEmpty()}"><td colspan="5" class="text-muted">No events yet.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
