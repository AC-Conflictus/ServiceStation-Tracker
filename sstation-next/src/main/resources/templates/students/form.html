<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
  <head>
    <title th:text="${heading}">Student</title>
  </head>
  <body>
    <main>
      <h1 class="h3 mb-3" th:text="${heading}">Student</h1>
      <form
        th:object="${student}"
        th:action="${student.id == null} ? @{/admin/students} : @{/admin/students/{id}(id=${student.id})}"
        method="post"
        class="row g-3">
        <div class="col-md-6">
          <label class="form-label">First name</label>
          <input type="text" class="form-control" th:field="*{firstname}"
                 th:classappend="${#fields.hasErrors('firstname')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Last name</label>
          <input type="text" class="form-control" th:field="*{lastname}"
                 th:classappend="${#fields.hasErrors('lastname')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">ACID</label>
          <input type="text" class="form-control" th:field="*{acid}"
                 th:classappend="${#fields.hasErrors('acid')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('acid')}" th:errors="*{acid}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">AC email</label>
          <input type="text" class="form-control" th:field="*{acEmail}"
                 th:classappend="${#fields.hasErrors('acEmail')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('acEmail')}" th:errors="*{acEmail}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">AC box</label>
          <input type="text" class="form-control" th:field="*{acBox}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" th:field="*{phone}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Class year</label>
          <input type="number" class="form-control" th:field="*{acYear}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Status (single char)</label>
          <input type="text" maxlength="1" class="form-control" th:field="*{status}"
                 th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Classification</label>
          <select class="form-select" th:field="*{classification}">
            <option value="">— none —</option>
            <option th:each="c : ${classifications}" th:value="${c}" th:text="${c.displayName}">Junior</option>
          </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" th:field="*{isModerator}" id="isMod" />
            <label class="form-check-label" for="isMod">Moderator</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/students}">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
