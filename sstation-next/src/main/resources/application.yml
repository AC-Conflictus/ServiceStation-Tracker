spring:
  application:
    name: sstation-next

  # Default (local dev) profile: embedded H2 in PostgreSQL-compatibility mode so a single set of
  # Flyway migrations (written for Postgres in TC-103) runs unchanged here and against real
  # Postgres in prod. Mirrors the Grails app's "H2 dev / file-or-Postgres prod" split.
  datasource:
    # Unique mem-DB name per application context (${random.uuid}) so parallel/!cached test
    # contexts each get an isolated database — a fixed name lets a committing context (e.g. the
    # dev-profile integration test) leak seed data into @DataJpaTest contexts.
    url: jdbc:h2:mem:sstation-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  # HTTP sessions live in the database, not instance memory (TC-122a). Vercel's Fluid compute may
  # serve any request from any instance, so in-memory sessions would bounce a signed-in user to
  # the login page at random. AC IT's single-container deploy does not need this, but it costs
  # nothing there and unblocks running more than one instance. `initialize-schema: never` —
  # Flyway V6 owns the session tables (the schema source of truth), so Spring Session must
  # never try to create them itself.
  session:
    jdbc:
      initialize-schema: never

server:
  # TC-122b: Vercel routes container traffic to whatever `PORT` says (its own default is 80), so
  # the port cannot be pinned in the image. Everything else — compose, `java -jar`, AC IT's own
  # deployment — leaves PORT unset and keeps 8080 exactly as before.
  port: ${PORT:8080}

# Approve/reject notification emails (TC-021 / TC-108a). The from-address is shared across
# profiles; the SMTP server itself (spring.mail.*) is only wired in prod (below), so local dev
# has no JavaMailSender and notifications fall back to a log line.
sstation:
  mail:
    from: ${SSTATION_MAIL_FROM:no-reply@austincollege.edu}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # TC-115: off unless a real relay is configured.
      #
      # SSTATION_MAIL_HOST is deliberately allowed to be empty (email is log-only until AC IT
      # supplies a relay). Spring still builds a JavaMailSender, because @ConditionalOnProperty
      # treats a *present but empty* spring.mail.host as set — and this indicator then fails to
      # connect and drags the whole /actuator/health response to DOWN. That makes the container's
      # HEALTHCHECK never pass, so `docker compose up` sits at "starting" forever and any load
      # balancer or orchestrator considers the app dead. Set to true once SMTP is real.
      enabled: ${SSTATION_MAIL_HEALTH_ENABLED:false}

---
# Production profile: real PostgreSQL, credentials from env vars (never committed). 🏫 AC IT
# substitutes their host/credentials via the documented SSTATION_* env vars (see DEPLOY in TC-110).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SSTATION_DB_URL}
    username: ${SSTATION_DB_USER}
    password: ${SSTATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  # SMTP for approve/reject notifications (TC-021). 🏫 AC IT supplies host/credentials via the
  # SSTATION_MAIL_* env vars. Defining spring.mail.host here is what activates the JavaMailSender
  # bean (absent in dev → notifications are logged, not sent).
  mail:
    # Default empty so Docker/RDS boots without SMTP; JavaMailSender stays off until host is set.
    host: ${SSTATION_MAIL_HOST:}
    port: ${SSTATION_MAIL_PORT:587}
    username: ${SSTATION_MAIL_USER:}
    password: ${SSTATION_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Behind AC IT's TLS-terminating reverse proxy, plain-HTTP requests arrive with the original
# scheme/host in X-Forwarded-* headers. Without this, the app sees "http" and builds absolute
# URLs (password-reset links, redirects) with the wrong scheme (TC-110b). `framework` registers
# Spring's ForwardedHeaderFilter, which reads X-Forwarded-Proto/Host/Port before the request
# reaches any controller. It is inert when no forwarded headers are present, so a direct
# connection is unaffected.
server:
  forward-headers-strategy: framework

---
# Demo profile (TC-114): showcase seeders only — always pair with prod + Postgres for Docker/AWS.
# Example: SPRING_PROFILES_ACTIVE=prod,demo and SSTATION_DEMO_*_PASSWORD env vars set.
spring:
  config:
    activate:
      on-profile: demo
